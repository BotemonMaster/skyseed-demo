html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #f6e7c1;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

(function () {
	function orient() {
		var vv = window.visualViewport;
		var w = vv ? vv.width : window.innerWidth;
		var h = vv ? vv.height : window.innerHeight;
		document.documentElement.classList.toggle('portrait', h > w);
	}
	orient();
	window.addEventListener('resize', orient);
	window.addEventListener('orientationchange', orient);
	if (window.visualViewport) {
		visualViewport.addEventListener('resize', orient);
		visualViewport.addEventListener('scroll', orient);
	}
	var tip = document.getElementById('home-tip');
	function iosSafari() {
		var ua = navigator.userAgent || '';
		var ios = /iPhone|iPad|iPod/.test(ua);
		var safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS/.test(ua);
		return ios && safari;
	}
	function standalone() {
		return window.navigator.standalone === true
			|| window.matchMedia('(display-mode: standalone)').matches
			|| window.matchMedia('(display-mode: fullscreen)').matches;
	}
	function syncTip() {
		if (!tip) return;
		var onTitle = window.__skyseed && window.__skyseed.title === true;
		var show = onTitle && iosSafari() && !standalone() && localStorage.getItem('skyseed-home-tip') !== '1';
		tip.hidden = !show;
	}
	if (tip) {
		tip.addEventListener('click', function () {
			localStorage.setItem('skyseed-home-tip', '1');
			tip.hidden = true;
		});
	}
	setInterval(syncTip, 400);
})();

(function () {
	var orig = window.fetch.bind(window);
	function fileName(input) {
		var raw = "";
		if (typeof input === "string") raw = input;
		else if (input instanceof URL) raw = input.href;
		else if (input && input.url) raw = input.url;
		if (!raw) return "";
		try { raw = new URL(raw, document.baseURI).pathname; } catch (err) { return ""; }
		return raw.slice(raw.lastIndexOf("/") + 1);
	}
	window.fetch = function (input, init) {
		if (fileName(input) !== "index.wasm") return orig(input, init);
		var part1 = new URL("index.wasm.part1", document.baseURI);
		var part2 = new URL("index.wasm.part2", document.baseURI);
		return Promise.all([orig(part1, init), orig(part2, init)]).then(function (parts) {
			if (!parts[0].ok || !parts[1].ok) throw new Error("Failed loading file 'index.wasm'");
			var len1 = Number(parts[0].headers.get("Content-Length")) || 0;
			var len2 = Number(parts[1].headers.get("Content-Length")) || 0;
			var total = len1 + len2;
			if (!total) {
				return Promise.all([parts[0].arrayBuffer(), parts[1].arrayBuffer()]).then(function (bufs) {
					var merged = new Uint8Array(bufs[0].byteLength + bufs[1].byteLength);
					merged.set(new Uint8Array(bufs[0]), 0);
					merged.set(new Uint8Array(bufs[1]), bufs[0].byteLength);
					return new Response(merged, {status:200, headers:{"Content-Type":"application/wasm","Content-Length":String(merged.byteLength)}});
				});
			}
			var stream = new ReadableStream({
				async start(controller) {
					async function pump(response) {
						var reader = response.body.getReader();
						for (;;) { var step = await reader.read(); if (step.done) return; controller.enqueue(step.value); }
					}
					try { await pump(parts[0]); await pump(parts[1]); controller.close(); }
					catch (err) { controller.error(err); }
				}
			});
			return new Response(stream, {status:200, headers:{"Content-Type":"application/wasm","Content-Length":String(total)}});
		});
	};
})();
</script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":7163484,"index.wasm":39514753},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			window.__skyseed = Object.assign(window.__skyseed || {}, {started:true, heap:(performance.memory && performance.memory.usedJSHeapSize) || 0});
		}, displayFailureNotice);
	}
}());
